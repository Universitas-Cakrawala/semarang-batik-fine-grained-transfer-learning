# Shared defaults for every run. Experiment files override
# only the keys that define their run group, so differences stay auditable.
paths:
  raw_dir: data/raw/semarang-batik
  processed_dir: data/processed/short320
  manifests_dir: data/manifests
  runs_dir: artifacts/runs
  metrics_dir: artifacts/metrics

data:
  kaggle_ref: edywinarno/semarang-batik-dataset
  kaggle_version: 2
  expected_images: 3020
  # Offline cache: EXIF-orientation corrected, shorter side resized to 320 px.
  # Deterministic, label-independent, applied before the split (no leakage).
  cache_short_side: 320
  split:
    seed: 42
    fractions: {train: 0.70, val: 0.15, test: 0.15}
    n_folds: 20          # StratifiedGroupKFold folds of ~5%: 14 train / 3 val / 3 test
  leakage:
    phash_max_distance: 8      # rotation/flip-invariant 64-bit pHash Hamming distance
    group_same_timestamp: true # same class + same EXIF capture second = same source photo
    embed_min_cosine: 0.95     # cosine of mean-centred ImageNet EfficientNet-B0 embeddings (0.90 chains into 150+ image groups)

preprocess:
  resize_short: 256
  crop: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augmentation:
  enabled: true
  random_resized_crop: {scale: [0.80, 1.00], ratio: [0.75, 1.3333]}
  hflip_p: 0.5
  # RandomRotation(15) and RandomAffine are applied as ONE affine warp so the image
  # is interpolated once; parameter ranges are unchanged.
  affine: {degrees: 15, translate: 0.05, scale: [0.90, 1.10], shear: 5}
  color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.02}

model:
  name: custom_cnn
  pretrained: false
  dropout: 0.3

train:
  strategy: single_stage
  epochs: 30
  batch_size: 32
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine        # per-step cosine annealing over the full epoch budget
  label_smoothing: 0.0
  amp: auto                # fp16 autocast on CUDA, disabled on CPU
  num_workers: 4
  early_stopping: false
  selection_metric: val_macro_f1

seeds: [42, 43, 44]
