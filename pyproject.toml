[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batik"
version = "0.1.0"
description = "From-scratch CNN vs transfer learning for Semarang Batik motif classification (UAS Deep Learning, Kelompok 5, Track A)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=2.0",
    "pandas>=2.0",
    "pillow>=10.0",
    "imagehash>=4.3",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
demo = ["gradio>=4.0"]

[project.scripts]
batik = "batik.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
